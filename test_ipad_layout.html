<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad布局测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        .test-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .test-result {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .viewport-info {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        .test-link {
            display: inline-block;
            background: #28a745;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 5px;
            margin: 10px;
            font-size: 18px;
        }
        .test-link:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🌈 iPad布局测试页面</h1>
        <p>这个页面用来测试iPad单屏模式的实现效果。</p>
        
        <div class="viewport-info">
            <h3>📱 当前视窗信息</h3>
            <p id="viewport-info">正在检测...</p>
        </div>
        
        <div class="test-result info">
            <h3>🔍 布局检测结果</h3>
            <div id="layout-detection">正在检测...</div>
        </div>
        
        <div class="test-result info">
            <h3>📏 触控目标检测</h3>
            <div id="touch-target-test">正在检测...</div>
        </div>
        
        <div class="test-result info">
            <h3>⚡ 性能测试</h3>
            <div id="performance-test">正在检测...</div>
        </div>
        
        <div style="text-align: center; margin: 30px 0;">
            <a href="http://localhost:8000" class="test-link">🚀 打开学习应用</a>
        </div>
        
        <div>
            <button onclick="runTests()">🔄 重新运行测试</button>
            <button onclick="simulateIPadLandscape()">📱 模拟iPad横屏</button>
            <button onclick="simulateIPadPortrait()">📱 模拟iPad竖屏</button>
            <button onclick="simulateMobile()">📱 模拟手机</button>
        </div>
    </div>

    <script>
        function updateViewportInfo() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const orientation = width > height ? '横屏' : '竖屏';
            const devicePixelRatio = window.devicePixelRatio || 1;
            
            document.getElementById('viewport-info').innerHTML = `
                <strong>屏幕尺寸:</strong> ${width} x ${height} 像素<br>
                <strong>方向:</strong> ${orientation}<br>
                <strong>设备像素比:</strong> ${devicePixelRatio}<br>
                <strong>用户代理:</strong> ${navigator.userAgent.includes('iPad') || navigator.userAgent.includes('Macintosh') ? 'iPad/Mac' : 'Other'}
            `;
        }

        function detectLayout() {
            const isIPadLandscape = window.matchMedia('(min-width: 1024px) and (orientation: landscape)').matches;
            const isIPadPortrait = window.matchMedia('(min-width: 768px) and (max-width: 1023px)').matches;
            const isMobile = window.matchMedia('(max-width: 767px)').matches;
            
            let layoutType = '未知';
            let cssSupport = '';
            
            if (isIPadLandscape) {
                layoutType = 'iPad横屏';
                cssSupport = '✅ 支持双栏布局';
            } else if (isIPadPortrait) {
                layoutType = 'iPad竖屏';
                cssSupport = '✅ 支持响应式布局';
            } else if (isMobile) {
                layoutType = '手机';
                cssSupport = '✅ 支持移动端布局';
            }
            
            document.getElementById('layout-detection').innerHTML = `
                <strong>检测到的布局类型:</strong> ${layoutType}<br>
                <strong>CSS支持:</strong> ${cssSupport}<br>
                <strong>媒体查询结果:</strong><br>
                • iPad横屏 (≥1024px landscape): ${isIPadLandscape ? '✅' : '❌'}<br>
                • iPad竖屏 (768-1023px): ${isIPadPortrait ? '✅' : '❌'}<br>
                • 手机 (≤767px): ${isMobile ? '✅' : '❌'}
            `;
        }

        function testTouchTargets() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            
            // 计算44pt在当前设备上的像素值
            const pointsToPixels = 44 * (window.devicePixelRatio || 1);
            const minTouchSize = Math.max(44, pointsToPixels / (window.devicePixelRatio || 1));
            
            document.getElementById('touch-target-test').innerHTML = `
                <strong>触控设备:</strong> ${isTouch ? '✅ 是' : '❌ 否'}<br>
                <strong>推荐最小触控目标:</strong> ${Math.round(minTouchSize)}px (44pt)<br>
                <strong>主要按钮建议尺寸:</strong> ${Math.round(minTouchSize * 1.1)}px (48pt+)<br>
                <strong>建议最小间距:</strong> 8pt ≈ ${Math.round(8 * (window.devicePixelRatio || 1) / (window.devicePixelRatio || 1))}px
            `;
        }

        function testPerformance() {
            const start = performance.now();
            
            // 简单的性能测试
            let frames = 0;
            const testDuration = 1000; // 1秒
            
            function countFrames() {
                frames++;
                if (performance.now() - start < testDuration) {
                    requestAnimationFrame(countFrames);
                } else {
                    const fps = Math.round(frames);
                    const loadTime = performance.now() - start;
                    
                    document.getElementById('performance-test').innerHTML = `
                        <strong>估算FPS:</strong> ${fps} (目标: ≥55fps)<br>
                        <strong>页面性能:</strong> ${fps >= 55 ? '✅' : '⚠️'} ${fps >= 55 ? '良好' : '需要优化'}<br>
                        <strong>测试耗时:</strong> ${Math.round(loadTime)}ms
                    `;
                }
            }
            
            requestAnimationFrame(countFrames);
        }

        function runTests() {
            updateViewportInfo();
            detectLayout();
            testTouchTargets();
            testPerformance();
        }

        function simulateIPadLandscape() {
            // 这只是提示，实际需要开发者工具模拟
            alert('请打开开发者工具，选择iPad Pro (12.9-inch)，设置为横屏模式，然后点击"重新运行测试"');
        }

        function simulateIPadPortrait() {
            alert('请打开开发者工具，选择iPad Pro (12.9-inch)，设置为竖屏模式，然后点击"重新运行测试"');
        }

        function simulateMobile() {
            alert('请打开开发者工具，选择iPhone 12 Pro或其他手机设备，然后点击"重新运行测试"');
        }

        // 监听屏幕变化
        window.addEventListener('resize', () => {
            setTimeout(runTests, 500);
        });

        window.addEventListener('orientationchange', () => {
            setTimeout(runTests, 1000);
        });

        // 页面加载完成后运行测试
        window.addEventListener('load', () => {
            setTimeout(runTests, 500);
        });

        // 立即运行一次测试
        runTests();
    </script>
</body>
</html>
